<defs>
  <!-- Original vector artwork drawn for this concept, in the style of a slim white washable marker. Ink-coloured parts follow the selected ink colour. -->

    <stop offset="0" stop-color="#D9DADB"/><stop offset=".18" stop-color="#F4F4F2"/><stop offset=".42" stop-color="#FFFFFF"/><stop offset=".75" stop-color="#EDEDEB"/><stop offset="1" stop-color="#C9CACB"/>
  </linearGradient>
  <linearGradient id="g-shade" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset=".28" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  <linearGradient id="g-glass" x1="0" x2="1" y1="0" y2="0">

  <linearGradient id="g-yellow" x1="0" x2="1"><stop offset="0" stop-color="#F6C21F"/><stop offset="1" stop-color="#F6C21F"/></linearGradient>
  <clipPath id="tip-clip"><path d="M-17,130 C-15,96 -10,56 -5,20 Q0,2 5,20 C10,56 15,96 17,130 Z"/></clipPath>

    <path d="M-17,130 C-15,96 -10,56 -5,20 Q0,2 5,20 C10,56 15,96 17,130 Z" fill="url(#g-shade)"/>
    <path d="M-24,128 H24 L22,170 H-22 Z" fill="url(#g-white)"/>
